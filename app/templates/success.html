<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Спасибо за оплату — Volgina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f6ee;
      --text: #413f3d;
      --btn-bg: #e8e6d2;
      --btn-border: #413f3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Lora", Georgia, serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    .wrap {
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .logo {
      display: block;
      width: min(280px, 80%);
      height: auto;
      margin: 0 auto 36px;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 600;
      margin: 0 0 14px;
      line-height: 1.3;
      color: var(--text);
    }
    p {
      margin: 0 0 32px;
      color: var(--text);
      line-height: 1.55;
      font-size: 1.05rem;
      font-weight: 400;
      opacity: 0.92;
    }
    .btn {
      display: inline-block;
      background: var(--btn-bg);
      color: var(--text);
      text-decoration: none;
      font-family: inherit;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 14px 32px;
      border: 3px solid var(--btn-border);
      border-radius: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .btn:hover {
      background: var(--text);
      color: var(--bg);
    }
    .error {
      color: var(--text);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/static/logo.png" alt="Volgina" width="280" height="80" />
    {% if ok %}
      <h1>Оплата прошла</h1>
      <p>Нажмите кнопку ниже — бот сразу выдаст одноразовую ссылку в закрытый чат.</p>
      <a class="btn" href="{{ telegram_url }}">Перейти в Telegram</a>
    {% else %}
      <h1>Не удалось подтвердить оплату</h1>
      <p class="error">{{ error }}</p>
    {% endif %}
  </div>
</body>
</html>
