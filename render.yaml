services:
  - type: web
    name: access-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_PATH
        value: ./data/bot.db
      # Остальные переменные задайте в Dashboard → Environment
